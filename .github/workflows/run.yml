name: Telegram Live Auto Joiner

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install ffmpeg build-essential cmake -y
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Script
      run: python main.py
